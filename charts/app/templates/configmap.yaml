{{- range $volume := .Values.volumes }}
{{- if $volume.files }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $volume.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}
    env: {{ $.Values.environment }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  {{- range $filename, $content := $volume.files }}
  {{ $filename }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

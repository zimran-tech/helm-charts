{{- if .Values.ingress.oidc.enabled }}
{{/*
Allows AWS Load Balancer Controller to read this release's k8s Secret
(<Release.Name>-secret) to configure OIDC on ALB. Without this, the controller
gets `secrets is forbidden` and silently leaves the ALB without OIDC auth.

Scoped to the single Secret managed by this chart (no broader access).

get/list/watch are all required: the controller reads the Secret through a
watch-based informer, not a one-off get. A Role with only "get" satisfies the
initial read but the informer's list/watch is denied, so the controller cannot
observe the Secret and never pushes the OIDC config to the ALB — the same
silent failure this Role exists to prevent.

Note that resourceNames does NOT restrict list/watch: those verbs act on the
collection, so they are granted namespace-wide for Secrets. That is inherent
to Kubernetes RBAC, and why this Role is per-release in the app's own
namespace rather than a cluster-wide grant.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-aws-lbc-secret-reader
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Release.Name }}-secret"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-aws-lbc-secret-reader
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: aws-load-balancer-controller
    namespace: kube-system
roleRef:
  kind: Role
  name: {{ .Release.Name }}-aws-lbc-secret-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}

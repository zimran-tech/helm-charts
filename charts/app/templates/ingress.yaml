{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    {{- with .Values.ingress.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.oidc.enabled }}
    {{- $issuer := .Values.ingress.oidc.issuer }}
    alb.ingress.kubernetes.io/auth-type: oidc
    # IdP config: OIDC endpoints (Okta Org AS layout) + name of the k8s Secret with clientID/clientSecret
    alb.ingress.kubernetes.io/auth-idp-oidc: '{"Issuer":"{{ $issuer }}","AuthorizationEndpoint":"{{ $issuer }}/oauth2/v1/authorize","TokenEndpoint":"{{ $issuer }}/oauth2/v1/token","UserInfoEndpoint":"{{ $issuer }}/oauth2/v1/userinfo","SecretName":"{{ .Release.Name }}-secret"}'
    # Redirect to OIDC login on missing/expired session (alternatives: deny, allow)
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    # Identity claims requested from IdP (no `groups` — ALB doesn't enforce them)
    alb.ingress.kubernetes.io/auth-scope: openid email profile
    alb.ingress.kubernetes.io/auth-session-timeout: "28800"  # 8 hours
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.class }}
  rules:
    {{- if .Values.ingress.domains }}
    {{- range .Values.ingress.domains }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-svc
                port:
                  number: {{ $.Values.network.port }}
    {{- end }}
    {{- else }}
    - {{- if .Values.ingress.domain }}
      host: {{ .Values.ingress.domain }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-svc
                port:
                  number: {{ .Values.network.port }}
    {{- end }}
{{- end}}
